<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Swipe Cover">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;display=swap');
      .word { font-family: 'Space Grotesk', 'DM Sans', system-ui, sans-serif; font-weight: 700; }
    </style>
    <radialGradient id="ball" cx="0.34" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#fff1f2"/>
      <stop offset="0.22" stop-color="#fca5a5"/>
      <stop offset="0.58" stop-color="#ef5353"/>
      <stop offset="1" stop-color="#8b252a"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ce8b9" stop-opacity="0"/>
      <stop offset="1" stop-color="#7ce8b9" stop-opacity=".55"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="#0b0f14"/>

  <!-- Emblem: a board, a swipe trail, covered dots and the ball -->
  <g transform="translate(70 60)">
    <rect x="0" y="0" width="300" height="300" rx="64" fill="#101a21" stroke="#7ce8b9" stroke-opacity=".35" stroke-width="3"/>
    <!-- swipe trail: right, then down -->
    <path d="M85 85 H215 V215" fill="none" stroke="url(#trail)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- uncovered dots -->
    <circle cx="85" cy="150" r="9" fill="#fb7185" fill-opacity=".85"/>
    <circle cx="85" cy="215" r="9" fill="#fb7185" fill-opacity=".85"/>
    <circle cx="150" cy="150" r="9" fill="#fb7185" fill-opacity=".85"/>
    <circle cx="150" cy="215" r="9" fill="#fb7185" fill-opacity=".85"/>
    <!-- covered dots -->
    <circle cx="150" cy="85" r="10" fill="#7ce8b9"/>
    <circle cx="215" cy="85" r="10" fill="#7ce8b9"/>
    <circle cx="215" cy="150" r="10" fill="#7ce8b9"/>
    <!-- ball, where the swipe started -->
    <g filter="url(#glow)">
      <circle cx="85" cy="85" r="30" fill="url(#ball)"/>
    </g>
    <!-- swipe chevrons -->
    <path d="M118 62 l16 23 -16 23" fill="none" stroke="#7ce8b9" stroke-opacity=".0" stroke-width="0"/>
  </g>

  <!-- Wordmark -->
  <text class="word" x="440" y="205" font-size="136" fill="#eef7f3" letter-spacing="-4">swipe</text>
  <text class="word" x="440" y="326" font-size="136" fill="#7ce8b9" letter-spacing="-4">cover</text>
  <circle cx="452" cy="378" r="6" fill="#fb7185"/>
  <text class="word" x="472" y="387" font-size="24" fill="#8fa3a0" letter-spacing="7" style="font-weight:500">DAILY SLIDING PUZZLE</text>
</svg>
